<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reseñas — JamBox</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="page-entidad" data-endpoint="/reviews">

  <header class="page-header">
    <a class="page-logo" href="/">JamBox</a>
    <nav class="page-nav">
      <a href="/artistas.html">Artistas</a>
      <a href="/albums.html">Álbumes</a>
      <a href="/songs.html">Canciones</a>
      <a href="/reviews.html" aria-current="page">Reseñas</a>
      <a href="/users.html">Usuarios</a>
    </nav>
  </header>

  <section class="entity-hero">
    <div class="entity-hero-inner">
      <span class="entity-hero-label">Comunidad</span>
      <h1>Reseñas</h1>
      <p class="entity-hero-desc">Leé y publicá reseñas de canciones y álbumes.</p>
    </div>
  </section>

  <div class="entity-body">

    <aside class="entity-form-panel">
      <h2>+ Nueva reseña</h2>
      <form id="form-entidad">
        <input type="date"   name="review_date"     placeholder="Fecha de la reseña" required>
        <input type="number" name="user_id_user"    placeholder="ID de usuario" min="1" required>
        <input type="number" name="song_id_song"    placeholder="ID de canción (opcional)">
        <input type="number" name="album_id_album"  placeholder="ID de álbum (opcional)">
        <input type="number" name="review_rate"     placeholder="Calificación (0 – 5)" min="0" max="5" step="0.5" required>
        <textarea            name="review_text"     rows="5" placeholder="Escribí tu reseña..." required></textarea>
        <button type="submit">Publicar reseña</button>
      </form>
    </aside>

    <section class="entity-list-panel">
      <div class="entity-list-header">
        <h2>Todas las reseñas</h2>
        <span class="entity-count" id="lista-count"></span>
      </div>
      <ul id="lista"></ul>
    </section>

  </div>

  <footer id="site-footer">
    <div id="footer-container">
      <nav id="footer-nav">
        <a href="/artistas.html">Artistas</a>
        <a href="/albums.html">Álbumes</a>
        <a href="/songs.html">Canciones</a>
        <a href="/reviews.html">Reseñas</a>
        <a href="/users.html">Usuarios</a>
      </nav>
      <p id="footer-copy">© 2026 JamBox.</p>
    </div>
  </footer>

  <script src="/entidades.js"></script>
</body>
</html>
