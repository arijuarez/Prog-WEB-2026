<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Álbumes — JamBox</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="page-entidad" data-endpoint="/albums">

  <header class="page-header">
    <a class="page-logo" href="/">JamBox</a>
    <nav class="page-nav">
      <a href="/artistas.html">Artistas</a>
      <a href="/albums.html" aria-current="page">Álbumes</a>
      <a href="/songs.html">Canciones</a>
      <a href="/reviews.html">Reseñas</a>
      <a href="/users.html">Usuarios</a>
    </nav>
  </header>

  <section class="entity-hero">
    <div class="entity-hero-inner">
      <span class="entity-hero-label">Explorar</span>
      <h1>Álbumes</h1>
      <p class="entity-hero-desc">Registrá lanzamientos y gestioná la discografía.</p>
    </div>
  </section>

  <div class="entity-body">

    <aside class="entity-form-panel">
      <h2>+ Nuevo álbum</h2>
      <form id="form-entidad">
        <input type="text"   name="album_name"       placeholder="Título del álbum" required>
        <input type="number" name="artist_id_artist"  placeholder="ID del artista" min="1" required>
        <input type="date"   name="release_date"      placeholder="Fecha de lanzamiento">
        <input type="number" name="album_ph"          placeholder="ID de portada (opcional)">
        <input type="number" name="album_dur"         placeholder="Duración (segundos, opcional)">
        <input type="number" name="likes"             placeholder="Likes (opcional)">
        <button type="submit">Crear álbum</button>
      </form>
    </aside>

    <section class="entity-list-panel">
      <div class="entity-list-header">
        <h2>Todos los álbumes</h2>
        <span class="entity-count" id="lista-count"></span>
      </div>
      <ul id="lista"></ul>
    </section>

  </div>

  <footer id="site-footer">
    <div id="footer-container">
      <nav id="footer-nav">
        <a href="/artistas.html">Artistas</a>
        <a href="/albums.html">Álbumes</a>
        <a href="/songs.html">Canciones</a>
        <a href="/reviews.html">Reseñas</a>
        <a href="/users.html">Usuarios</a>
      </nav>
      <p id="footer-copy">© 2026 JamBox.</p>
    </div>
  </footer>

  <script src="/entidades.js"></script>
</body>
</html>
